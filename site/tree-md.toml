version = 1
forest = "forest.toml"
# The output root must not overlap a source root, and must be listed in
# forest.toml's [forest].trees.
# trees-md/ is not tracked here: it is populated from the Markdown repository
# (the Obsidian vault) by build.sh locally and by deploy.yml in CI. tree-md's
# source roots must live under this directory, so the notes are copied in.
sources = ["trees-md"]
output = "generated"
target = "forester-6.0-dev@30b73641cef02433ee158db6ddc77f7b49de60be"

[id]
# Addresses are minted in Obsidian, by the plugin, into the vault — where the
# note is actually kept. This build must not mint: trees-md/ is a copy that
# build.sh deletes and repopulates, so an address written here would be thrown
# away before the next build, and a fresh random one put in its place. Since
# the output is named by the identity, that would rename every published page
# on every build. A tree that states no id is addressed by its file name,
# which is stable.
mint = "off"

# The vault is the source; the site is what MIYA-LIS.NET/ reaches. Everything
# those trees link to is published because it is linked to — notes/frege is
# carried by the embed in notes — and the rest of the vault is not compiled at
# all, so a draft with a broken link cannot fail this build.
[publish]
from = ["MIYA-LIS.NET/**"]
