name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, miya, hero-theme]
  workflow_dispatch:

# One deploy at a time: each run rebuilds the whole forest to publish the same
# site, so overlapping them is waste.
concurrency:
  group: deploy
  cancel-in-progress: false

# tree_of_md with support for the closed unavailable node (feat/public-unavailable).
env:
  TREE_OF_MD_REVISION: 0b505e9407904e21460207d51f09dad20e47629c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is built from the approved public snapshot alone, never from
      # the vault: site/public-snapshot names the miya-lis-public commit, and
      # build.sh refuses it unless its manifest has the approved digest.
      # GITHUB_TOKEN is scoped to this repository, so reading that private
      # repository needs PUBLIC_CONTENT_TOKEN.
      - name: Read the approved snapshot
        id: snapshot
        run: |
          . site/public-snapshot
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the approved snapshot
        uses: actions/checkout@v4
        with:
          repository: ryoryoryo3838/miya-lis-public
          ref: ${{ steps.snapshot.outputs.revision }}
          token: ${{ secrets.PUBLIC_CONTENT_TOKEN }}
          path: .snapshot
          persist-credentials: false

      # Forester 6.0 needs OCaml 5.4.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      # With opam rather than dune package management: forester.6.0 requires
      # dune >= 3.25.0, and dune 3.25 offers itself to its own solver as "3.25",
      # which opam orders before 3.25.0, so `dune pkg lock` cannot select it.
      - name: Install Forester and js_of_ocaml
        run: opam install -y forester.6.0 js_of_ocaml js_of_ocaml-ppx

      # tree_of_md is developed in its own public repository, so the pin needs no
      # credentials. It is pinned to a commit, not a branch: its public mode is
      # the converter every published page passes through.
      #
      # Building tree_of_md and its dependency closure takes about three minutes,
      # and the result only changes with the pin. No restore-keys: an
      # approximate match here would mean silently converting with the wrong
      # tree_of_md.
      - name: Restore tree_of_md
        id: tree_of_md-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tree_of_md
          key: tree_of_md-${{ runner.os }}-${{ runner.arch }}-${{ env.TREE_OF_MD_REVISION }}

      - name: Install tree_of_md
        if: steps.tree_of_md-cache.outputs.cache-hit != 'true'
        run: |
          opam pin add -yn tree_of_md "git+https://github.com/ryoryoryo3838/tree_of_md#$TREE_OF_MD_REVISION"
          opam install -y tree_of_md
          mkdir -p "$HOME/.local/bin"
          cp "$(opam var bin)/tree_of_md" "$HOME/.local/bin/tree_of_md"

      - name: Convert the snapshot
        run: |
          TREE_OF_MD="$HOME/.local/bin/tree_of_md" \
            sh site/build.sh snapshot "$GITHUB_WORKSPACE/.snapshot"

      # decorate.py copies it from the theme into the site.
      - name: Build hero.js
        run: |
          opam exec -- dune build lib_theme/hero.bc.js
          cp _build/default/lib_theme/hero.bc.js site/theme/hero.js

      # build.sh renders the forest and then dresses it in the site's shell.
      - name: Build forester site
        run: FORESTER="$(opam var bin)/forester" sh site/build.sh forest

      - name: Check the hero route
        run: sh ../test/hero-route.sh
        working-directory: site

      # The project is a Worker serving static assets, configured by
      # wrangler.jsonc at the repository root; `pages deploy` targets a
      # different Cloudflare product and ignores that file.
      # wranglerVersion is not optional here. The action defaults to wrangler 3,
      # which requires a `main` entry point and rejects an assets-only Worker
      # with "Missing entry-point"; serving a directory with no script of its
      # own is a wrangler 4 feature.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
