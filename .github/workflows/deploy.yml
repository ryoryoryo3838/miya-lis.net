name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, miya, hero-theme]
  # Sent by the Markdown repository (the Obsidian vault) when a note changes.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# One deploy at a time: each run rebuilds the whole forest to publish the same
# site, so overlapping them is waste.
#
# Not cancel-in-progress. obsidian-git backs the vault up every 3 minutes and a
# full run takes ~15, so cancelling would kill every build before it finished
# and nothing would ever deploy while notes are being edited. Queueing instead
# lets the running build finish; GitHub keeps at most one pending run per group
# and supersedes it, so a burst of edits still collapses to one deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Markdown sources are versioned separately from the site.
      #
      # The whole vault is checked out, not the published folder alone. A
      # published page may link to a note kept anywhere in it —
      # MIYA-LIS.NET/notes embeds notes/frege — and a note that was never
      # fetched cannot be resolved. Fetching it is not publishing it: what
      # reaches the site is settled by tree-md.toml's [publish].from, which
      # names MIYA-LIS.NET/** and pulls in whatever those trees reach. The rest
      # of the vault is never compiled, never emitted, and never leaves the
      # runner.
      #
      # GITHUB_TOKEN is scoped to this repository alone, so reading another
      # private repository needs CONTENT_TOKEN even under the same account.
      - name: Check out the Markdown sources
        uses: actions/checkout@v4
        with:
          repository: ryoryoryo3838/wiki.miya-lis.net
          ref: main
          token: ${{ secrets.CONTENT_TOKEN }}
          path: .content

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build with dune package management
        uses: ocaml-dune/setup-dune@v2
        with:
          version: 3.22.2
          steps: install-dune install-gpatch install-depexts build-deps build

      # tree-md is developed in its own public repository, so the pin needs no
      # credentials. Resolving `main` to a commit here does two things: the
      # cache below can key on it, and the build stops depending on when it ran.
      - name: Resolve the tree-md revision
        id: tree-md
        run: |
          sha=$(git ls-remote https://github.com/ryoryoryo3838/tree-md main | cut -f1)
          test -n "$sha" || { echo "could not resolve tree-md main" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree-md is $sha"

      # Building tree-md and its dependency closure takes about three minutes,
      # and the result only changes when tree-md does. No restore-keys: an
      # approximate match here would mean silently compiling with the wrong
      # tree-md.
      - name: Restore tree-md
        id: tree-md-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tree-md
          key: tree-md-${{ runner.os }}-${{ runner.arch }}-${{ steps.tree-md.outputs.sha }}

      - name: Install tree-md
        if: steps.tree-md-cache.outputs.cache-hit != 'true'
        run: |
          opam pin add -yn tree-md "git+https://github.com/ryoryoryo3838/tree-md#${{ steps.tree-md.outputs.sha }}"
          opam install -y tree-md
          mkdir -p "$HOME/.local/bin"
          cp "$(opam var bin)/tree-md" "$HOME/.local/bin/tree-md"

      # build.sh owns the sync as well as the compile, so that CI and a local
      # build stage the vault the same way. They did not: CI had its own copy
      # of the loop that copied from .content/MIYA-LIS.NET and so dropped that
      # prefix from every path. [publish].from is matched against the path
      # below the source root, so `MIYA-LIS.NET/**` then named nothing, the
      # build published nothing, and forester built a forest with no trees in
      # it — a failure that only surfaced two steps later, as a site with no
      # root.
      - name: Compile the Markdown sources
        run: |
          FOREST_CONTENT="$GITHUB_WORKSPACE/.content" \
          TREE_MD="$HOME/.local/bin/tree-md" \
            sh site/build.sh md
          find site/trees-md -type f | sort

      # hero.bc.js is compiled by setup-dune's 'build' step above (dune build)
      - name: Build hero.js
        run: |
          cp _build/default/lib_theme/hero.bc.js site/theme/hero.js
          cp _build/default/lib_theme/hero.bc.js assets/hero.js

      # build.sh already locates the forester executable — it handles both the
      # installed layout and the one dune's package management produces — and
      # writes the hero entry afterwards. CI had reimplemented that with a
      # single hardcoded relative path, which resolved under site/ and was not
      # there.
      - name: Build forester site
        run: sh site/build.sh forest

      - name: Check the hero route
        run: sh ../test/hero-route.sh
        working-directory: site

      # The project is a Worker serving static assets, configured by
      # wrangler.jsonc at the repository root; `pages deploy` targets a
      # different Cloudflare product and ignores that file.
      # wranglerVersion is not optional here. The action defaults to wrangler 3,
      # which requires a `main` entry point and rejects an assets-only Worker
      # with "Missing entry-point"; serving a directory with no script of its
      # own is a wrangler 4 feature.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
