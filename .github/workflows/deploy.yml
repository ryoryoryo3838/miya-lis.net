name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, miya, hero-theme]
  # Sent by the Markdown repository (the Obsidian vault) when a note changes.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# A push and a note edit can land within seconds of each other, and each run
# rebuilds the whole forest to deploy the same site. Only the last one matters.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Markdown sources are versioned separately from the site. Only the
      # notes directory is fetched; the rest of the vault is personal.
      # GITHUB_TOKEN is scoped to this repository alone, so reading another
      # private repository needs CONTENT_TOKEN even under the same account.
      - name: Check out the Markdown sources
        uses: actions/checkout@v4
        with:
          repository: ryoryoryo3838/wiki.miya-lis.net
          ref: main
          token: ${{ secrets.CONTENT_TOKEN }}
          sparse-checkout: MIYA-LIS.NET
          sparse-checkout-cone-mode: false
          path: .content

      - name: Stage the Markdown sources
        run: |
          rm -rf site/trees-md
          mkdir -p site/trees-md
          (cd .content/MIYA-LIS.NET && find . -type f -name '*.tree.md') |
            while IFS= read -r rel; do
              mkdir -p "site/trees-md/$(dirname "$rel")"
              cp ".content/MIYA-LIS.NET/$rel" "site/trees-md/$rel"
            done
          find site/trees-md -type f | sort

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build with dune package management
        uses: ocaml-dune/setup-dune@v2
        with:
          version: 3.22.2
          steps: install-dune install-gpatch install-depexts build-deps build

      # tree-md is developed in its own public repository, so the pin needs no
      # credentials.
      - name: Install tree-md
        run: |
          opam pin add -yn tree-md git+https://github.com/ryoryoryo3838/tree-md#main
          opam install -y tree-md

      - name: Compile the Markdown sources
        run: opam exec -- tree-md build --config tree-md.toml
        working-directory: site

      # hero.bc.js is compiled by setup-dune's 'build' step above (dune build)
      - name: Build hero.js
        run: |
          cp _build/default/lib_theme/hero.bc.js site/theme/hero.js
          cp _build/default/lib_theme/hero.bc.js assets/hero.js

      - name: Build forester site
        run: _build/install/default/bin/forester build forest.toml
        working-directory: site

      - name: Mark home entry for HERO
        run: |
          sh site/mark-hero-entry.sh
          (cd site && sh ../test/hero-route.sh)

      # The project is a Worker serving static assets, configured by
      # wrangler.jsonc at the repository root; `pages deploy` targets a
      # different Cloudflare product and ignores that file.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
