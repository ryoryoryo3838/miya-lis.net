name: Synthetic snapshot dry run (build only)

on:
  push:
    branches:
      - 'ci/synthetic-dry-run-*'

permissions:
  contents: read

concurrency:
  group: synthetic-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-html:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/synthetic-dry-run-') && github.repository == 'ryoryoryo3838/miya-lis.net'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted code-only site tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Reject missing synthetic inputs before installation or content access
        id: pins
        run: >-
          python3 scripts/synthetic-ci-config.py
          --inputs config/synthetic-inputs.json
          --pins config/pins.json
          --github-output "$GITHUB_OUTPUT"

      - name: Install Nix without an Actions cache
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=github:NixOS/nixpkgs/70ce234312134a463ba7728e94da2486a1d237ac

      - name: Install checksum-pinned Devbox 0.18.4 executable only
        id: devbox_bootstrap
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import tarfile
          import tempfile
          import urllib.request

          release_url = 'https://github.com/jetify-com/devbox/releases/download/0.18.4/devbox_0.18.4_linux_amd64.tar.gz'
          expected_sha256 = '4a466a8788186da73f3c692697917c79452b758f40b454b4761e6d1fcd2acad9'
          try:
              with urllib.request.urlopen(release_url, timeout=120) as response:
                  payload = response.read(16 * 1024 * 1024 + 1)
              if len(payload) > 16 * 1024 * 1024 or hashlib.sha256(payload).hexdigest() != expected_sha256:
                  raise ValueError
              with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
                  members = archive.getmembers()
                  if len(members) != 1 or members[0].name != 'devbox' or not members[0].isreg():
                      raise ValueError
                  member = members[0]
                  if not 0 < member.size <= 32 * 1024 * 1024:
                      raise ValueError
                  with archive.extractfile(member) as stream:
                      executable = stream.read(member.size + 1)
                  if len(executable) != member.size:
                      raise ValueError
              runner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              if not runner_temp.is_dir() or any(char in str(runner_temp) for char in '\r\n'):
                  raise ValueError
              bin_dir = Path(tempfile.mkdtemp(prefix='devbox-bin-', dir=runner_temp))
              binary = bin_dir / 'devbox'
              with binary.open('xb') as output:
                  output.write(executable)
              binary.chmod(0o755)
              with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
                  output.write(str(bin_dir) + '\n')
          except Exception:
              raise SystemExit('TC_DEVBOX_INSTALL')
          PY

      - name: Compile trusted source-only site client with Devbox-provided Dune and existing dune.lock
        id: client_build
        timeout-minutes: 50
        run: python3 scripts/build-theme-client.py --site-root . --diagnostics

      - name: Run synthetic gate and theme regressions
        run: |
          python3 -B -m unittest discover -s test -p test_safe_web.py -v
          python3 -B -m unittest discover -s test -p 'test_*theme*.py' -v
          python3 -B -m unittest discover -s test -p test_owned_css_leak.py -v
          python3 -B -m unittest discover -s test -p test_devbox_bootstrap.py -v
          python3 -B -m unittest discover -s test -p test_synthetic_workflow.py -v
          python3 -B -m unittest discover -s test -p test_site_layout.py -v
          python3 -B test/forester_version_test.py

      - name: Checkout only the approved synthetic snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ryoryoryo3838/miya-lis-public
          ref: ${{ steps.pins.outputs.content_revision }}
          token: ${{ secrets.PUBLIC_CONTENT_TOKEN }}
          path: approved-content
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Checkout the fixed tree_of_md converter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ryoryoryo3838/tree-md
          ref: ${{ steps.pins.outputs.converter_revision }}
          path: reviewed-converter
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Realize fixed native Forester 6.0-dev
        run: >-
          nix build --option allow-import-from-derivation true
          'git+https://tangled.org/jonmsterling.com/ocaml-forester?ref=forester-6.0-dev&rev=f8fb5f5d88923db36643cf9c20c662adff969c98#legacyPackages.x86_64-linux.forester'
          --out-link "$RUNNER_TEMP/pinned-forester"

      - name: Build and audit the immutable synthetic snapshot
        env:
          CONTENT_REV: ${{ steps.pins.outputs.content_revision }}
          SNAPSHOT_SHA256: ${{ steps.pins.outputs.manifest_sha256 }}
          HOME_ID: ${{ steps.pins.outputs.home_id }}
        run: >-
          python3 scripts/safe-web.py ci-run
          --pins config/pins.json
          --content-rev "$CONTENT_REV"
          --manifest-sha256 "$SNAPSHOT_SHA256"
          --snapshot-repository approved-content
          --converter-repository reviewed-converter
          --forester "$RUNNER_TEMP/pinned-forester/bin/forester"
          --home "$HOME_ID"
          --theme-config config/theme.json
          --site-root .
          --out-dir "$RUNNER_TEMP/synthetic-public-html"

      - name: Upload only audited synthetic HTML and assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-public-html
          path: ${{ runner.temp }}/synthetic-public-html/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 6
